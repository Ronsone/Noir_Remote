# Builds the NOIR firmware. Two channels on GitHub Pages:
#   stable  firmware/manifest.json       = the latest GitHub release (everyone)
#   test    firmware/beta/manifest.json  = the newest build, published by "Run workflow" (testers, NOIR Builder > Test)
# Stable only changes when you release:
#   GitHub > Releases > Draft a new release > tag v<version> (same as substitutions: version in firmware/noir-remote.yaml) > Publish
# Then it is published on GitHub Pages:
#   https://ronsone.github.io/Noir_Remote/                         installer (USB, from the browser)
#   https://ronsone.github.io/Noir_Remote/firmware/manifest.json   updates (NOIR Builder > Update firmware)
# A push to main that changes the firmware only checks that it still builds - nothing reaches the remotes.
name: Firmware

on:
  push:
    branches: [main]
    paths: ["firmware/**", "site/**", ".github/workflows/firmware.yml"]
  release:
    types: [published]
  workflow_dispatch:   # publish the newest build to the test channel (stable stays the latest release)

permissions:
  contents: write   # keep the firmware with a release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ESPHome
        run: pip install esphome==2026.11.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-2026.11.1
      - name: Build
        run: esphome compile firmware/noir-remote.yaml
      - name: Site and manifests (stable + test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^  version: "\(.*\)"/\1/p' firmware/noir-remote.yaml)
          if [ "${{ github.event_name }}" = "release" ] && [ "${{ github.event.release.tag_name }}" != "v$version" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match firmware version v$version"; exit 1
          fi
          build=firmware/.esphome/build/noir-remote/build
          manifest() {   # dir version
            md5=$(md5sum "$1/firmware.ota.bin" | cut -d' ' -f1)
            printf '{"name":"NOIR Remote","version":"%s","home_assistant_domain":"esphome","new_install_prompt_erase":true,"builds":[{"chipFamily":"ESP32-S3","ota":{"path":"firmware.ota.bin","md5":"%s","summary":"NOIR Remote %s","release_url":"https://github.com/${{ github.repository }}/releases"},"parts":[{"path":"firmware.factory.bin","offset":0}]}]}' "$2" "$md5" "$2" > "$1/manifest.json"
          }
          mkdir -p out/firmware/beta
          cp -r site/. out/
          # test channel: always this build
          cp $build/firmware.ota.bin $build/firmware.factory.bin out/firmware/beta/
          manifest out/firmware/beta "$version"
          if [ "${{ github.event_name }}" = "release" ]; then
            # a release: this build is stable too, and is kept with the release for later deploys
            cp $build/firmware.ota.bin $build/firmware.factory.bin out/firmware/
            manifest out/firmware "$version"
            gh release upload "${{ github.event.release.tag_name }}" out/firmware/firmware.ota.bin out/firmware/firmware.factory.bin --clobber
          elif tag=$(gh release view --json tagName -q .tagName 2>/dev/null) && gh release download "$tag" -p 'firmware.*.bin' -D out/firmware; then
            manifest out/firmware "${tag#v}"   # stable = the latest release
          else
            echo "No release yet: stable = this build"
            cp out/firmware/beta/firmware.* out/firmware/ && manifest out/firmware "$version"
          fi
          cat out/firmware/manifest.json; echo; cat out/firmware/beta/manifest.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    if: github.event_name != 'push'   # only a release (or a manual run) reaches the remotes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
