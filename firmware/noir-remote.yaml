# =============================================================================
# NOIR Remote - own, lean firmware for the OpenRemote Rev6 (ESP32-S3)
# Everything you see is set up in Home Assistant: NOIR Builder (integration noir_remote).
#
# One firmware for every NOIR remote - it holds no secrets, so GitHub builds it and the remote updates itself:
#   Wi-Fi          set once on the remote's own network "noir-remote setup" (captive portal)
#   API key        Home Assistant gives it to the remote when it adds it (ESPHome encryption without a fixed key)
#   host + key     the NOIR Remote integration sends them with the action noir_setup; kept in flash
#   updates        Home Assistant / NOIR Builder > Update firmware (downloads from GitHub Pages)
# Build it yourself (developers):  esphome run noir-remote.yaml   (tested with ESPHome 2026.11)
#
# This file = the NOIR core (core/noir-core.yaml, the same on every device) + the board (boards/rev6.yaml).
# =============================================================================

substitutions:
  device_name: noir-remote
  friendly_name: NOIR Remote
  version: "0.7.5"
  manifest: https://ronsone.github.io/Noir_Remote/firmware/manifest.json

packages:
  core: !include core/noir-core.yaml
  board: !include boards/rev6.yaml
