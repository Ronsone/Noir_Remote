image:
  - {platform: file, id: img_wall, file: images/obsidian.png, type: RGB565}
  - {platform: file, id: img_tv, file: images/home_tv.png, type: RGB565, transparency: alpha_channel}
  - {platform: file, id: img_audio, file: images/home_audio.png, type: RGB565, transparency: alpha_channel}
  - {platform: file, id: img_licht, file: images/home_light.png, type: RGB565, transparency: alpha_channel}
  - {platform: file, id: img_scenes, file: images/home_scenes.png, type: RGB565, transparency: alpha_channel}

# ---- Every 100 ms: lamp states, status bar, display timeout ------------------------------------------------------
interval:
  - interval: 100ms
    then:
      - if:
          condition: {lambda: 'return noirapp::wake_flag();'}
          then:
            - light.turn_on: {id: display_backlight, brightness: 100%, transition_length: 80ms}
      - lambda: |-
          auto now = id(ha_time).now();
          noirapp::tick(millis(), now.is_valid() ? now.hour : -1, now.is_valid() ? now.minute : 0,
                       id(akku_pct).has_state() ? (int) id(akku_pct).state : -1,
                       api::global_api_server != nullptr && api::global_api_server->is_connected(),
                       wifi::global_wifi_component->is_connected() ? (int) wifi::global_wifi_component->wifi_rssi() : 0);
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t idle = noirapp::idle_ms() / 1000;
          auto *bl = id(display_backlight);
          if (idle >= noirapp::off_s()) { if (bl->current_values.is_on()) { auto c = bl->turn_off(); c.perform(); } }
          else if (idle >= noirapp::dim_s()) { if (bl->current_values.get_brightness() > 0.2f) { auto c = bl->turn_on(); c.set_brightness(0.15f); c.perform(); } }

lvgl:
  displays: [main_display]
  touchscreens: [main_touch]
  buffer_size: 25%
  bg_color: 0x07080A
  text_color: 0xF2F3F5
  pages:
    - id: page_home
      bg_color: 0x07080A
      bg_opa: COVER
      pad_all: 12
      pad_top: 10
      scrollbar_mode: "off"
      scrollable: false
    # Never shown. The screens are built in C++ (noir-ui.h); ESPHome only switches on the LVGL parts
    # it sees in this file. This page tells it which widgets, fonts and images the screens use.
    - id: page_parts
      skip: true
      widgets:
        - label: {hidden: true, text: "", text_font: f12}
        - label: {hidden: true, text: "", text_font: f14}
        - label: {hidden: true, text: "", text_font: f16}
        - label: {hidden: true, text: "", text_font: f20}
        - label: {hidden: true, text: "", text_font: f48}
        - label: {hidden: true, text: "", text_font: ico20}
        - image: {hidden: true, src: img_wall}
        - button: {hidden: true}
        - slider: {hidden: true}
