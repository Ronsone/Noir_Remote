# =============================================================================
# NOIR Remote - own, lean firmware for the OpenRemote Rev6 (ESP32-S3)
#
# Version 0.2: Home tiles, Lights, Scenes, TV (any TV in HA; keys by infrared from a brand profile).
# Everything you see is set up in Home Assistant: NOIR Builder (integration noir_remote).
#
# Build: put your secrets.yaml next to this file, then:  esphome run noir-remote.yaml
#
# ---- Copy these lines to secrets.yaml (same folder as this file) ------------------------------------------
# Easiest: Home Assistant fills them in for you - copy, paste, add your Wi-Fi. Where:
#   First time:  Settings > Devices & services > + Add integration > NOIR Remote   (shown after setup)
#   Any time:    sidebar NOIR Builder > tab Remote > First-time setup > Copy
#
#   wifi_ssid: "your Wi-Fi name"
#   wifi_password: "your Wi-Fi password"
#   noir_device: "noir-remote"
#   noir_host: "192.168.1.10:8123"      # IP:port of Home Assistant
#   noir_key: "..."                     # from NOIR Remote in Home Assistant
#   noir_api_key: "..."                 # from NOIR Remote in Home Assistant
#   noir_ota: "..."                     # from NOIR Remote in Home Assistant
#
# secrets.yaml stays on your PC - never share it, never put it in Git.
# -----------------------------------------------------------------------------------------------------------
# =============================================================================

substitutions:
  device_name: !secret noir_device
  friendly_name: NOIR Remote
  ha_host: !secret noir_host          # IP:port of Home Assistant
  noir_key: !secret noir_key

packages:
  logos: !include logos.yaml   # logos for the TV source tiles (generated by tools/make_logos.py)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: ronsone.noir-remote
    version: "0.2.0"
  includes:
    - mdi_icons.h
    - noir-ui.h
    - modules        # every feature is a module (core, home, lights, scenes, tv)
    - noir-app.h
  on_boot:
    # +VSW (display, touch, I2C pull-ups): GPIO38 LOW. The display driver keeps it on; set early so the
    # touch controller has its 300 ms to settle before it starts.
    - priority: 950
      then:
        - lambda: |-
            gpio_set_direction(GPIO_NUM_38, GPIO_MODE_OUTPUT);
            gpio_set_level(GPIO_NUM_38, 0);
    - priority: -100
      then:
        - lambda: |-
            noirapp::start("${ha_host}", "${noir_key}");
            noirapp::build(id(page_home)->obj,
                            {id(f12)->get_lv_font(), id(f14)->get_lv_font(), id(f16)->get_lv_font(),
                             id(ico20)->get_lv_font(), id(f20)->get_lv_font(), id(f48)->get_lv_font()},
                            {id(img_wall), id(img_tv), id(img_audio), id(img_licht), id(img_scenes)});
        - light.turn_on: {id: display_backlight, brightness: 100%}

esp32:
  board: esp32-s3-devkitc1-n16r8
  flash_size: 16MB
  flash_mode: dio
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

external_components:
  - source: {type: local, path: components}
    components: [ili9341_i80, ft63x6, tca8418, max17048]

# Logs: wireless (Device Builder > Logs). NOT over USB: on the Rev6 the USB pins (GPIO19/20) are the I2C bus.
logger:
  level: DEBUG

api:
  encryption:
    key: !secret noir_api_key
  homeassistant_services: true   # the remote switches lights, scenes and the speaker via HA actions
  # Home Assistant (NOIR Builder) calls this after "Save": fetch the new configuration
  actions:
    - action: noir_reload
      then:
        - lambda: 'noirapp::fetch_config();'
    # NOIR Builder "Test": send one infrared code (TV setup)
    - action: noir_ir
      variables: {protocol: string, address: int, command: int}
      then:
        - lambda: 'noirapp::ir_test(protocol, address, command);'

ota:
  - platform: esphome
    password: !secret noir_ota

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none   # Full mode; Eco mode (NOIR Builder) lets Wi-Fi sleep between packets
  ap:
    ssid: "${device_name} setup"

captive_portal:

safe_mode:

http_request:   # brings esp_http_client and the JSON library for the NOIR downloads
  timeout: 6s

time:
  - platform: homeassistant
    id: ha_time

i2c:
  id: hauptbus
  sda: GPIO20
  scl: GPIO19

# ---- Display, touch, backlight ----------------------------------------------------------------------------------
display:
  - platform: ili9341_i80
    id: main_display
    cs_pin: GPIO39
    dc_pin: GPIO40
    wr_pin: GPIO41
    rd_pin: GPIO42
    enable_pin: {number: GPIO38}
    invert_colors: true
    data_pins: [GPIO48, GPIO47, GPIO21, GPIO14, GPIO13, GPIO12, GPIO11, GPIO10]
    dimensions: {width: 240, height: 320}
    bus_frequency: 20MHz
    update_interval: 1s

touchscreen:
  - platform: ft63x6
    id: main_touch
    display: main_display
    update_interval: 10ms
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      - lambda: 'noirapp::touched();'

output:
  - platform: ledc
    id: backlight_pwm
    pin: {number: GPIO9, inverted: true}
    frequency: 20000Hz
    min_power: 0.0005
    zero_means_zero: true
  - platform: ledc
    id: button_backlight_pwm
    pin: {number: GPIO46}
    frequency: 20000Hz

light:
  - platform: monochromatic
    id: display_backlight
    output: backlight_pwm
    default_transition_length: 200ms
    restore_mode: ALWAYS_OFF
  - platform: monochromatic
    id: button_backlight
    output: button_backlight_pwm
    restore_mode: ALWAYS_OFF

# ---- Infrared -----------------------------------------------------------------------------------------------------
remote_transmitter:
  id: ir_tx
  pin: {number: GPIO5, inverted: true}
  carrier_duty_percent: 50%
  non_blocking: true

# ---- Keys (TCA8418 5x5 matrix) ----------------------------------------------------------------------------------
tca8418:
  id: keypad
  address: 0x34
  interrupt_pin: {number: GPIO8}
  rows: 5
  columns: 5
  extra_gpi_pins: [5]
  debounce: 12ms
  long_press: 500ms
  on_key:
    - then:
        - lambda: 'noirapp::key(keycode, pressed, long_press);'

# ---- Battery --------------------------------------------------------------------------------------------------------
sensor:
  - platform: max17048
    address: 0x36
    update_interval: 30s
    battery_level:
      id: akku_pct
      name: "Battery"
    voltage:
      id: akku_v
      name: "Battery voltage"
  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi signal"
    update_interval: 30s

text_sensor:
  - platform: template
    id: noir_versie
    name: "NOIR config"
    icon: mdi:view-grid-outline
    entity_category: diagnostic
    update_interval: never

# ---- Fonts and images ---------------------------------------------------------------------------------------------
font:
  - {file: fonts/Inter-Regular.ttf, id: f12, size: 12, bpp: 4, glyphs: &tekst " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~€°±·«»¿¡ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝßàáâãäåæçèéêëìíîïñòóôõöøùúûüýÿ–—’‘”“„…←"}
  - {file: fonts/Inter-Regular.ttf, id: f14, size: 14, bpp: 4, glyphs: *tekst}
  - {file: fonts/Inter-Regular.ttf, id: f16, size: 16, bpp: 4, glyphs: *tekst}
  - {file: fonts/Inter-Regular.ttf, id: f20, size: 20, bpp: 4, glyphs: *tekst}
  - {file: fonts/Inter-Regular.ttf, id: f48, size: 48, bpp: 4, glyphs: "0123456789:-°"}
  - file: fonts/mdi-subset.ttf
    id: ico20
    size: 20
    bpp: 4
    glyphs: ["\U000F001B", "\U000F0020", "\U000F0026", "\U000F0035", "\U000F0045", "\U000F004D", "\U000F0054", "\U000F005D", "\U000F0079", "\U000F0084", "\U000F0099", "\U000F009A", "\U000F009C", "\U000F00AC", "\U000F00AF", "\U000F00DF", "\U000F0100", "\U000F010B", "\U000F0118", "\U000F0119", "\U000F011C", "\U000F012C", "\U000F0140", "\U000F0141", "\U000F0142", "\U000F0143", "\U000F0156", "\U000F0176", "\U000F01BE", "\U000F01D8", "\U000F01D9", "\U000F0210", "\U000F0211", "\U000F0241", "\U000F024A", "\U000F0279", "\U000F0290", "\U000F0297", "\U000F02AF", "\U000F02DC", "\U000F02E3", "\U000F02E9", "\U000F02FC", "\U000F0306", "\U000F030B", "\U000F0311", "\U000F0314", "\U000F0322", "\U000F032A", "\U000F0335", "\U000F033E", "\U000F035C", "\U000F036C", "\U000F0374", "\U000F0376", "\U000F037D", "\U000F0381", "\U000F0388", "\U000F0393", "\U000F03D8", "\U000F03E4", "\U000F0405", "\U000F040A", "\U000F040E", "\U000F0414", "\U000F0415", "\U000F0417", "\U000F0425", "\U000F042B", "\U000F0438", "\U000F0439", "\U000F0448", "\U000F044A", "\U000F0454", "\U000F0456", "\U000F045F", "\U000F0493", "\U000F049D", "\U000F04AD", "\U000F04AE", "\U000F04B2", "\U000F04B9", "\U000F04C3", "\U000F04C7", "\U000F04CE", "\U000F04DB", "\U000F04DE", "\U000F04F6", "\U000F0502", "\U000F0508", "\U000F050F", "\U000F051B", "\U000F0567", "\U000F057C", "\U000F057E", "\U000F057F", "\U000F0580", "\U000F0581", "\U000F0590", "\U000F0591", "\U000F0592", "\U000F0593", "\U000F0594", "\U000F0595", "\U000F0596", "\U000F0597", "\U000F0598", "\U000F0599", "\U000F059D", "\U000F059E", "\U000F05A8", "\U000F05A9", "\U000F05C3", "\U000F067E", "\U000F067F", "\U000F06A1", "\U000F06B5", "\U000F06BA", "\U000F06D5", "\U000F06D9", "\U000F06DA", "\U000F06E8", "\U000F0717", "\U000F072A", "\U000F0746", "\U000F075A", "\U000F075D", "\U000F075E", "\U000F075F", "\U000F0769", "\U000F07AE", "\U000F07D6", "\U000F07E1", "\U000F07F4", "\U000F081A", "\U000F081B", "\U000F081C", "\U000F0869", "\U000F08BB", "\U000F08D0", "\U000F08DD", "\U000F0906",