# =============================================================================
# NOIR core - everything that is the same on every NOIR device: Home Assistant link, updates, Wi-Fi setup,
# the screens (C++ in this folder) and their fonts and images.
#
# The core knows no boards. A board file (firmware/boards/*.yaml) brings the hardware and must provide:
#   ids            main_display (display), main_touch (touchscreen), display_backlight (light)
#   substitutions  noir_board                    short board name, e.g. rev6 (Home Assistant knows its keys by it)
#                  noir_width, noir_height       screen size in pixels
#                  noir_touch, noir_keys, noir_ir, noir_battery_sensor   capabilities: "true" / "false"
#                  noir_battery                  C++ expression: battery % (int), -1 = unknown / none
# A device file (firmware/noir-*.yaml) = substitutions (name, version, manifest) + this core + one board.
# =============================================================================

packages:
  logos: !include ../logos.yaml   # logos for the TV source tiles (generated by tools/make_logos.py)

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: ronsone.noir-remote
    version: "${version}"
  # paths are relative to the device file (firmware/)
  includes:
    - core/mdi_icons.h
    - core/noir-ui.h
    - core/modules   # every feature is a module (core, home, lights, scenes, tv, audio, airco, nav)
    - core/noir-app.h
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            noirapp::device("${device_name}", "${noir_board}", ${noir_width}, ${noir_height},
                            ${noir_touch}, ${noir_keys}, ${noir_ir}, ${noir_battery_sensor});
            noirapp::start(id(noir_host), id(noir_key));
            if (!id(noir_update_url).empty()) id(firmware_update)->set_source_url(id(noir_update_url));   // test channel / local
            noirapp::build(id(page_home)->obj,
                            {id(f12)->get_lv_font(), id(f14)->get_lv_font(), id(f16)->get_lv_font(),
                             id(ico20)->get_lv_font(), id(f20)->get_lv_font(), id(f48)->get_lv_font()},
                            {id(img_wall), id(img_tv), id(img_audio), id(img_licht), id(img_scenes)});
        - light.turn_on: {id: display_backlight, brightness: 100%}

# Logs: wireless (Device Builder > Logs). Boards whose USB pins are busy (Rev6) can't log over USB.
logger:
  level: DEBUG

api:
  encryption: {}                 # no fixed key: Home Assistant sets one when it adds the remote
  homeassistant_services: true   # the remote switches lights, scenes and the speaker via HA actions
  actions:
    # NOIR Remote (integration) after adding the remote: where Home Assistant is and the shared key
    - action: noir_setup
      variables: {host: string, key: string}
      then:
        - lambda: |-
            id(noir_host) = host;
            id(noir_key) = key;
            noirapp::setup(host, key);
    # NOIR Remote: where updates come from (stable / test channel); "" = the default (stable). Kept in flash.
    - action: noir_channel
      variables: {url: string}
      then:
        - lambda: |-
            if (url == id(noir_update_url)) return;
            id(noir_update_url) = url;
            id(firmware_update)->set_source_url(url.empty() ? std::string("${manifest}") : url);
            id(firmware_update)->update();
    # Home Assistant (NOIR Builder) calls this after "Save": fetch the new configuration
    - action: noir_reload
      then:
        - lambda: 'noirapp::fetch_config();'
    # NOIR Builder "Test": send one infrared code (TV setup)
    - action: noir_ir
      variables: {protocol: string, address: int, command: int}
      then:
        - lambda: 'noirapp::ir_test(protocol, address, command);'

globals:
  - {id: noir_host, type: std::string, restore_value: true, max_restore_data_length: 64, initial_value: '""'}
  - {id: noir_key, type: std::string, restore_value: true, max_restore_data_length: 64, initial_value: '""'}
  - {id: noir_update_url, type: std::string, restore_value: true, max_restore_data_length: 120, initial_value: '""'}

ota:
  - platform: http_request     # updates from GitHub (update: below)

update:
  - platform: http_request
    id: firmware_update
    name: Firmware
    source: ${manifest}
    update_interval: 6h

wifi:
  power_save_mode: none   # Full mode; Eco mode (NOIR Builder) lets Wi-Fi sleep between packets
  ap:
    ssid: "${device_name} setup"   # first start: connect your phone to this network and choose your Wi-Fi

captive_portal:

safe_mode:

http_request:   # brings esp_http_client and the JSON library for the NOIR downloads
  timeout: 6s

time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi signal"
    update_interval: 30s

text_sensor:
  - platform: template
    id: noir_config_version
    name: "NOIR config"
    icon: mdi:view-grid-outline
    entity_category: diagnostic
    update_interval: never

# ---- Fonts and images ---------------------------------------------------------------------------------------------
font:
  - {file: fonts/Inter-Regular.ttf, id: f12, size: 12, bpp: 4, glyphs: &tekst " !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~€°±·«»¿¡ÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÑÒÓÔÕÖØÙÚÛÜÝßàáâãäåæçèéêëìíîïñòóôõöøùúûüýÿ–—’‘”“„…←"}
  - {file: fonts/Inter-Regular.ttf, id: f14, size: 14, bpp: 4, glyphs: *tekst}
  - {file: fonts/Inter-Regular.ttf, id: f16, size: 16, bpp: 4, glyphs: *tekst}
  - {file: fonts/Inter-Regular.ttf, id: f20, size: 20, bpp: 4, glyphs: *tekst}
  - {file: fonts/Inter-Regular.ttf, id: f48, size: 48, bpp: 4, glyphs: "0123456789:-°"}
  - file: fonts/mdi-subset.ttf
    id: ico20
    size: 20
    bpp: 4
    glyphs: ["\U000F001B", "\U000F004D", "\U000F00AC", "\U000F00ED", "\U000F0140", "\U000F0176", "\U000F0210", "\U000F0241", "\U000F02DC", "\U000F02E3", "\U000F032A", "\U000F0335", "\U000F033E", "\U000F0374", "\U000F0388", "\U000F040A", "\U000F0414", "\U000F0415", "\U000F0425", "\U000F0493", "\U000F04B9", "\U000F04C3", "\U000F04CE", "\U000F04E1", "\U000F0502", "\U000F050F", "\U000F058C", "\U000F0590", "\U000F0591", "\U000F0593", "\U000F0594", "\U000F0595", "\U000F0596", "\U000F0597", "\U000F0598", "\U000F0599", "\U000F059D", "\U000F05A8", "\U000F05C3", "\U000F06B5", "\U000F0717", "\U000F0746", "\U000F075A", "\U000F0769", "\U000F07D6", "\U000F07E1", "\U000F081A", "\U000F08D0", "\U000F08DD", "\U000F0A70", "\U000F0BED", "\U000F0FCE", "\U000F111C", "\U000F12BA", "\U000F1C91"]

image:
  - {platform: file, id: img_wall, file: images/obsidian.png, type: RGB565}
  - {platform: file, id: img_tv, file: images/home_tv.png, type: RGB565, transparency: alpha_channel}
  - {platform: file, id: img_audio, file: images/home_audio.png, type: RGB565, transparency: alpha_channel}
  - {platform: file, id: img_licht, file: images/home_light.png, type: RGB565, transparency: alpha_channel}
  - {platform: file, id: img_scenes, file: images/home_scenes.png, type: RGB565, transparency: alpha_channel}

# ---- Every 100 ms: lamp states, status bar, display timeout ------------------------------------------------------
interval:
  - interval: 100ms
    then:
      - if:
          condition: {lambda: 'return noirapp::wake_flag();'}
          then:
            - light.turn_on: {id: display_backlight, brightness: 100%, transition_length: 80ms}
      - lambda: |-
          auto now = id(ha_time).now();
          noirapp::tick(millis(), now.is_valid() ? now.hour : -1, now.is_valid() ? now.minute : 0,
                       ${noir_battery},
                       api::global_api_server != nullptr && api::global_api_server->is_connected(),
                       wifi::global_wifi_component->is_connected() ? (int) wifi::global_wifi_component->wifi_rssi() : 0);
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t idle = noirapp::idle_ms() / 1000;
          auto *bl = id(display_backlight);
          if (idle >= noirapp::off_s()) { if (bl->current_values.is_on()) { auto c = bl->turn_off(); c.perform(); } }
          else if (idle >= noirapp::dim_s()) { if (bl->current_values.get_brightness() > 0.2f) { auto c = bl->turn_on(); c.set_brightness(0.15f); c.perform(); } }

lvgl:
  displays: [main_display]
  touchscreens: [main_touch]
  buffer_size: 25%
  bg_color: 0x07080A
  text_color: 0xF2F3F5
  pages:
    - id: page_home
      bg_color: 0x07080A
      bg_opa: COVER
      pad_all: 12
      pad_top: 10
      scrollbar_mode: "off"
      scrollable: false
    # Never shown. The screens are built in C++ (noir-ui.h); ESPHome only switches on the LVGL parts
    # it sees in this file. This page tells it which widgets, fonts and images the screens use.
    - id: page_parts
      skip: true
      widgets:
        - label: {hidden: true, text: "", text_font: f12}
        - label: {hidden: true, text: "", text_font: f14}
        - label: {hidden: true, text: "", text_font: f16}
        - label: {hidden: true, text: "", text_font: f20}
        - label: {hidden: true, text: "", text_font: f48}
        - label: {hidden: true, text: "", text_font: ico20}
        - image: {hidden: true, src: img_wall}
        - button: {hidden: true}
        - slider: {hidden: true}
        - arc: {hidden: true}
        - obj: {hidden: true, layout: {type: flex, flex_flow: row}, widgets: [label: {text: ""}]}
